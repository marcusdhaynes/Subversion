name: Native builds
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["src/**", "src-tauri/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", ".github/workflows/native.yml"]
  push:
    branches: [main]
    paths: ["src/**", "src-tauri/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", ".github/workflows/native.yml"]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon app-icon.svg
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Subversion-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon app-icon.svg
      - name: Select installed Android NDK
        run: |
          ndk_dir=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
      - run: npm run android:init -- --ci
      - run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: Subversion-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon app-icon.svg
      - run: npm run ios:init -- --ci
      - name: Build unsigned iOS simulator app
        run: npm run ios:build -- --ci --debug --target aarch64-sim --no-sign
      - name: Package simulator app
        run: |
          app_path=$(find src-tauri/gen/apple/build -type d -name '*.app' -print -quit)
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" Subversion-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Subversion-iOS-Simulator
          path: Subversion-iOS-Simulator.zip
