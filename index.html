<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SubFlow Studio - Collaborative Subtitle Editor</title>
    <meta name="description" content="Ultra-fast, lightweight real-time collaborative subtitle editor for Web, Windows, Android, and iOS." />
    <meta property="og:title" content="SubFlow Studio - Collaborative Subtitle Editor" />
    <meta property="og:description" content="Ultra-fast, lightweight real-time collaborative subtitle editor for Web, Windows, Android, and iOS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SubFlow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // HMR is disabled in this preview environment. Suppress unhandled WebSocket connection errors from @vite/client
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('@vite/client'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      (function() {
        try {
          var mode = localStorage.getItem('subflow_theme_mode') || localStorage.getItem('subflow_darkmode');
          var isDark = mode === 'dark' || mode === 'true' || (mode === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-neutral-400/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
